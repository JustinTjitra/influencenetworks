[project]
name = "id-influence-network"
version = "0.1.0"
description = "Documented political-business relationships in Indonesian palm oil and banking, joined to media ownership and coverage"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.2",
  "pandas>=2.1",
  "httpx>=0.27",
  "trafilatura>=1.8",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
nlp = ["transformers>=4.40", "torch>=2.2", "splink>=4.0"]
app = ["streamlit>=1.35", "pyvis>=0.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
